name: "Label PCB Boards"
description: "Add labels to PRs based on which boards have changes"
author: "Diode Inc."

inputs:
  token:
    description: "GitHub token with permission to add labels"
    required: false
    default: ${{ github.token }}
  pr-number:
    description: "PR number to label (defaults to current PR from event context)"
    required: false
    default: ${{ github.event.pull_request.number }}

runs:
  using: "composite"
  steps:
    - name: Get board paths and label PR
      id: label
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -e -o pipefail

        PR_NUMBER="${{ inputs.pr-number }}"
        REPO="${GITHUB_REPOSITORY}"
        API_ROOT="https://api.github.com/repos/${REPO}"

        if [[ -z "$PR_NUMBER" ]]; then
          echo "No PR number provided, skipping label update"
          exit 0
        fi

        if [[ -z "$GH_TOKEN" ]]; then
          echo "GH_TOKEN is required to manage labels"
          exit 1
        fi

        echo "Processing PR #$PR_NUMBER"

        # Get board info from pcb
        PCB_INFO=$(pcb info -f json)

        # Extract board names and their relative paths
        # Handle both old format (.boards[]) and new format (.packages[].config.board)
        BOARDS_JSON=$(echo "$PCB_INFO" | jq -c '
          if .packages then
            [.packages | to_entries[] | select(.value.config.board != null) | {
              name: .value.config.board.name,
              path: .value.rel_path
            }]
          else
            [.boards[] | {name: .name, path: .path}]
          end
        ')

        echo "Found boards: $BOARDS_JSON"

        # Get the diff between base and head
        git fetch origin "$GITHUB_BASE_REF" --depth=1 2>/dev/null || true
        CHANGED_FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD 2>/dev/null || git diff --name-only HEAD~1)

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Find which boards have changes
        LABELS_TO_ADD=()
        while IFS= read -r board_entry; do
          BOARD_NAME=$(echo "$board_entry" | jq -r '.name')
          BOARD_PATH=$(echo "$board_entry" | jq -r '.path')

          # Check if any changed file is within this board's path
          if echo "$CHANGED_FILES" | grep -q "^${BOARD_PATH}/"; then
            echo "Board $BOARD_NAME has changes (path: $BOARD_PATH)"
            LABELS_TO_ADD+=("board:$BOARD_NAME")
          fi
        done < <(echo "$BOARDS_JSON" | jq -c '.[]')

        if [[ ${#LABELS_TO_ADD[@]} -eq 0 ]]; then
          echo "No board-specific changes detected"
          exit 0
        fi

        echo "Labels to add: ${LABELS_TO_ADD[*]}"

        # Add labels (create if they don't exist)
        for label in "${LABELS_TO_ADD[@]}"; do
          echo "Adding label: $label"
          create_payload=$(jq -cn \
            --arg name "$label" \
            --arg description "Changes to board ${label#board:}" \
            --arg color "0366d6" \
            '{name: $name, description: $description, color: $color}')

          create_response=$(curl -sS \
            -X POST "${API_ROOT}/labels" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$create_payload" \
            -w "\n%{http_code}")
          create_status="${create_response##*$'\n'}"
          if [[ "$create_status" != "201" && "$create_status" != "422" ]]; then
            echo "Failed to create label $label (HTTP $create_status)"
            echo "${create_response%$'\n'*}"
            exit 1
          fi

          add_payload=$(jq -cn --arg label "$label" '{labels: [$label]}')
          add_response=$(curl -sS \
            -X POST "${API_ROOT}/issues/${PR_NUMBER}/labels" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$add_payload" \
            -w "\n%{http_code}")
          add_status="${add_response##*$'\n'}"
          if [[ "$add_status" -lt 200 || "$add_status" -ge 300 ]]; then
            echo "Failed to add label $label to PR #$PR_NUMBER (HTTP $add_status)"
            echo "${add_response%$'\n'*}"
            exit 1
          fi
        done

        echo "Labels added successfully"
